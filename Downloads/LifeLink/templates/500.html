{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · LifeLink</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/css/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="section">
    <div class="shell shell--narrow text-center">
      <p class="meta mb-2">Error 500</p>
      <h1 class="display" style="font-size:clamp(2rem,4vw,3rem)">The server could not finish that request</h1>
      <p class="lead mx-auto mt-3" style="max-width:52ch">
        Nothing was saved. Try the action again, and if it keeps failing send the LifeLink desk the
        time it happened.
      </p>
      <div class="d-flex gap-2 justify-content-center flex-wrap mt-4">
        <a class="btn-ll btn-ll--primary" href="/">Back to LifeLink</a>
        <a class="btn-ll btn-ll--ghost" href="/contact/">Contact the desk</a>
      </div>
    </div>
  </main>
</body>
</html>
