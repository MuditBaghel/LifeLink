<div class="empty">
  <div class="empty__icon" aria-hidden="true"><i class="bi {{ icon|default:'bi-inbox' }}"></i></div>
  <p class="empty__title">{{ title|default:"Nothing here yet" }}</p>
  {% if body %}<p class="empty__body">{{ body }}</p>{% endif %}
  {% if action_url and action_label %}
    <div class="empty__action">
      <a class="btn-ll btn-ll--ghost btn-ll--sm" href="{{ action_url }}">{{ action_label }}</a>
    </div>
  {% endif %}
</div>
